<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img"><title>Estados de reserva y movimientos de estadía</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#33434b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#152b35}.title{font-size:22px;font-weight:bold}.small{font-size:18px}.edge{fill:none;stroke:#33434b;stroke-width:2;marker-end:url(#arrow)}</style><rect x="10" y="15" width="220" height="75" rx="8" fill="#f1f5f5" stroke="#6b7b82"/><text x="120.0" y="46" text-anchor="middle" class="title">Pendiente</text><text x="120.0" y="73" text-anchor="middle" class="small">solicitud pública</text><rect x="290" y="15" width="220" height="75" rx="8" fill="#f1f5f5" stroke="#6b7b82"/><text x="400.0" y="46" text-anchor="middle" class="title">Confirmada</text><text x="400.0" y="73" text-anchor="middle" class="small">ocupa disponibilidad</text><rect x="570" y="15" width="220" height="75" rx="8" fill="#f1f5f5" stroke="#6b7b82"/><text x="680.0" y="46" text-anchor="middle" class="title">Cancelada</text><text x="680.0" y="73" text-anchor="middle" class="small">libera fechas</text><rect x="10" y="160" width="220" height="75" rx="8" fill="#f1f5f5" stroke="#6b7b82"/><text x="120.0" y="191" text-anchor="middle" class="title">Rechazada</text><text x="120.0" y="218" text-anchor="middle" class="small">no ocupa fechas</text><rect x="290" y="190" width="220" height="75" rx="8" fill="#f1f5f5" stroke="#6b7b82"/><text x="400.0" y="221" text-anchor="middle" class="title">Llegada registrada</text><text x="400.0" y="248" text-anchor="middle" class="small">stays sin salida</text><rect x="570" y="190" width="220" height="75" rx="8" fill="#f1f5f5" stroke="#6b7b82"/><text x="680.0" y="221" text-anchor="middle" class="title">Salida registrada</text><text x="680.0" y="248" text-anchor="middle" class="small">stays con salida</text><rect x="570" y="360" width="220" height="75" rx="8" fill="#f1f5f5" stroke="#6b7b82"/><text x="680.0" y="391" text-anchor="middle" class="title">Limpieza pendiente</text><text x="680.0" y="418" text-anchor="middle" class="small">habilita tarea</text><path class="edge" d="M230 52 H290"/><text style="font-size:14px" x="260" y="35" text-anchor="middle">confirmar</text><path class="edge" d="M120 90 V160"/><text class="small" x="165" y="132" text-anchor="middle">rechazar</text><path class="edge" d="M510 52 H570"/><text style="font-size:14px" x="540" y="35" text-anchor="middle">cancelar</text><path class="edge" d="M400 90 V190"/><text class="small" x="442" y="145" text-anchor="middle">check-in</text><path class="edge" d="M510 228 H570"/><text style="font-size:13px" x="540" y="210" text-anchor="middle">check-out</text><path class="edge" d="M680 265 V360"/><text class="small" x="720" y="315" text-anchor="middle">genera</text><text x="10" y="300" class="small">Recepción puede crear directamente</text><text x="10" y="326" class="small">una reserva confirmada.</text><text x="10" y="386" class="small">Cancelar y reprogramar exigen</text><text x="10" y="412" class="small">que no exista llegada registrada.</text><text x="10" y="465" class="small">Después de la salida, la reserva conserva el estado confirmada.</text></svg>